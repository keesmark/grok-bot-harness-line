name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Test with coverage
        run: |
          npm run coverage | tee coverage.txt
          { echo '## Coverage'; echo '```'; sed -n '/% Coverage report/,$p' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
