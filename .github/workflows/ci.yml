name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Deploy ボタンは各フォルダの中で完結している必要があるので、共通の部品は写しで持つ。中身が食い違わないか確かめる。
  shared-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for file in src/body.ts src/signature.ts; do
            diff -u "forward/$file" "inbox/$file"
          done

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [forward, inbox]
    defaults:
      run:
        working-directory: ${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.worker }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
